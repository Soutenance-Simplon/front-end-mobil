name: frontend
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.10.4


dependencies:
  flutter:
    sdk: flutter
    
  flutter_facebook_auth: ^7.1.0
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.3.0

  # HTTP + JWT
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2

  # Image picker
  image_picker: ^1.1.2

  # Routing + State management
  go_router: ^14.2.0
  flutter_riverpod: ^2.3.6

  # Internationalisation + date formatting
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  file_picker: ^10.3.8
  country_code_picker: ^3.4.1
  lottie: ^3.3.2
  flutter_animate: ^4.5.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  url_launcher: ^6.3.2
  zxing2: ^0.2.4
  image: ^4.9.2
  jitsi_meet_flutter_sdk: ^13.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  
  flutter_lints: ^6.0.0


flutter:

  
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    -  assets/images/
    # -  assets/animations/eye.json

  
